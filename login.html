<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion – ClothesToShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec 0%, #fdf6f9 60%, #f8bbd0 100%);
            display: flex;
            align-items: center;
            padding: 2rem 0;
        }
        .carte-login {
            background: #fff0f5;
            border-radius: 20px;
            border: 1px solid #f48fb1;
            padding: 2rem;
        }
        .champ-rose {
            border: 1.5px solid #f48fb1;
            border-radius: 12px;
            color: #ad1457;
        }
        .champ-rose:focus {
            border-color: #e91e8c;
            box-shadow: 0 0 0 3px rgba(233, 30, 140, 0.15);
            outline: none;
        }
        .btn-rose {
            background: #e91e8c;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 500;
        }
        .btn-rose:hover {
            background: #c2185b;
            color: white;
        }
        .titre-app  { color: #ad1457; }
        .sous-titre { color: #c2185b; }
        .lien-rose  { color: #e91e8c; font-weight: 500; text-decoration: none; }
        .lien-rose:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-5">

            <div class="text-center mb-4">
                <div style="font-size: 40px;">👗</div>
                <h1 class="titre-app">ClothesToShare</h1>
                <p class="sous-titre">Connecte-toi pour accéder à ta garde-robe</p>
            </div>

            <div class="carte-login">
                <h2 class="text-center titre-app mb-4">Connexion</h2>

                <div id="loginForm">

                    <div class="mb-3">
                        <label for="login" class="form-label sous-titre fw-bold">Login</label>
                        <input type="text" class="form-control champ-rose" id="login" placeholder="Ton login">
                    </div>

                    <div class="mb-3">
                        <label for="mdp" class="form-label sous-titre fw-bold">Mot de passe</label>
                        <input type="password" class="form-control champ-rose" id="mdp" placeholder="••••••••">
                    </div>

                    <div id="erreurLogin" class="alert alert-danger d-none"></div>

                    <button id="btnConnexion" class="btn btn-rose w-100 mt-2">
                        Se connecter
                    </button>

                </div>
            </div>

            <p class="text-center mt-3" style="font-size: 14px; color: #c2185b;">
                Pas encore de compte ?
                <a href="inscription.html" class="lien-rose">S'inscrire</a>
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Admins issus de la base de données
    const admins = [
        { login: 'hannahtaisa',      mdp: 'hannahtaisa',      nom: 'Tarisa',   prenom: 'Hannah',   role: 'admin' },
        { login: 'doesuria',         mdp: 'doesuria',         nom: 'Doe',      prenom: 'Suria',    role: 'admin' },
        { login: 'griffithnephtali', mdp: 'griffithnephtali', nom: 'Griffith', prenom: 'Nephtali', role: 'admin' }
    ];

    document.getElementById('btnConnexion').addEventListener('click', function () {
        const login  = document.getElementById('login').value.trim();
        const mdp    = document.getElementById('mdp').value;
        const erreur = document.getElementById('erreurLogin');

        erreur.classList.add('d-none');

        if (!login || !mdp) {
            erreur.textContent = 'Merci de remplir tous les champs.';
            erreur.classList.remove('d-none');
            return;
        }

        const utilisateur = admins.find(a => a.login === login && a.mdp === mdp);

        if (utilisateur) {
            // Sauvegarder l'utilisateur connecté pour y accéder depuis index.html
            sessionStorage.setItem('user', JSON.stringify(utilisateur));
            // Redirection vers l'accueil
            window.location.href = 'index.html';
        } else {
            erreur.textContent = 'Login ou mot de passe incorrect.';
            erreur.classList.remove('d-none');
        }
    });

    // Connexion avec la touche Entrée
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('btnConnexion').click();
    });
</script>

</body>
</html>
