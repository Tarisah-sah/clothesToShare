<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClothesToShare - Garde-robe partagée</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div id="composant-navbar"></div>

    <main class="container my-4" id="app-content">

        <!-- PANNEAU ADMIN -->
        <div id="panneau-admin" class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0" style="color:#ad1457;">Demandes d'inscription en attente</h4>
                <button class="btn btn-sm btn-outline-secondary" id="btn-fermer-admin">Fermer</button>
            </div>
            <div id="liste-demandes">
                <p class="text-muted">Chargement...</p>
            </div>
        </div>

        <div id="composant-recherche"></div>

        <div id="section-dressing">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 id="titre-section-vetements">Accueil</h2>
                
                <button class="btn btn-primary" id="btn-afficher-ajout">+ Ajouter</button>
            </div>
            <div class="row g-4" id="liste-vetements"></div>
        </div>

        <div id="section-arborescence" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 id="titre-arborescence">Explorer par Locaux</h2>
                <button class="btn btn-outline-secondary d-none" id="btn-retour-arborescence">⬅ Retour</button>
            </div>
            
            <div id="conteneur-bulles" class="d-flex gap-4 flex-wrap justify-content-center">
                </div>
        </div>

        <div id="composant-formulaire"></div>

    </main>

    <div id="composant-modals"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/api.js"></script>
    <script src="frontend/js/ui.js"></script>
    <script src="frontend/js/vetements.js"></script>
    <script src="frontend/js/arborescence.js"></script>
    <script src="frontend/js/auth.js"></script>
    <script src="frontend/js/main.js"></script>
</body>
</html>
