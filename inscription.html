<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription – ClothesToShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec 0%, #fdf6f9 60%, #f8bbd0 100%);
            display: flex;
            align-items: center;
            padding: 2rem 0;
        }
        .carte-inscription {
            background: #fff0f5;
            border-radius: 20px;
            border: 1px solid #f48fb1;
            padding: 2rem;
        }
        .champ-rose {
            border: 1.5px solid #f48fb1;
            border-radius: 12px;
            color: #ad1457;
        }
        .champ-rose:focus {
            border-color: #e91e8c;
            box-shadow: 0 0 0 3px rgba(233, 30, 140, 0.15);
            outline: none;
        }
        .btn-rose {
            background: #e91e8c;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 500;
        }
        .btn-rose:hover { background: #c2185b; color: white; }
        .btn-rose:disabled { background: #f48fb1; cursor: not-allowed; }
        .titre-app  { color: #ad1457; }
        .sous-titre { color: #c2185b; }
        .lien-rose  { color: #e91e8c; font-weight: 500; text-decoration: none; }
        .lien-rose:hover { text-decoration: underline; }
        .form-check-input:checked { background-color: #e91e8c; border-color: #e91e8c; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">

            <div class="text-center mb-4">
                <h1 class="titre-app">ClothesToShare</h1>
                <p class="sous-titre">Crée ton compte, l'admin validera ta demande</p>
            </div>

            <div class="carte-inscription">
                <h2 class="text-center titre-app mb-4">Inscription</h2>

                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label sous-titre fw-bold">Nom</label>
                        <input type="text" class="form-control champ-rose" id="nom" placeholder="Ton nom">
                    </div>
                    <div class="col-6">
                        <label class="form-label sous-titre fw-bold">Prénom</label>
                        <input type="text" class="form-control champ-rose" id="prenom" placeholder="Ton prénom">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label sous-titre fw-bold">Email</label>
                    <input type="email" class="form-control champ-rose" id="email" placeholder="ton@email.com">
                </div>

                <div class="mb-3">
                    <label class="form-label sous-titre fw-bold">Adresse</label>
                    <input type="text" class="form-control champ-rose" id="adresse" placeholder="Ton adresse">
                </div>

                <div class="mb-3">
                    <label class="form-label sous-titre fw-bold">Login</label>
                    <input type="text" class="form-control champ-rose" id="login" placeholder="Ton login">
                </div>

                <div class="mb-3">
                    <label class="form-label sous-titre fw-bold">Sexe</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="sexe" id="femme" value="F">
                            <label class="form-check-label sous-titre" for="femme">Femme</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="sexe" id="homme" value="H">
                            <label class="form-check-label sous-titre" for="homme">Homme</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="sexe" id="autre" value="A">
                            <label class="form-check-label sous-titre" for="autre">Autre</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label sous-titre fw-bold">Mot de passe</label>
                    <input type="password" class="form-control champ-rose" id="mdp" placeholder="••••••••">
                </div>

                <div class="mb-3">
                    <label class="form-label sous-titre fw-bold">Confirmer le mot de passe</label>
                    <input type="password" class="form-control champ-rose" id="mdpConfirm" placeholder="••••••••">
                </div>

                <div id="erreurInscription" class="alert alert-danger d-none"></div>
                <div id="succesInscription" class="alert d-none text-center"
                     style="background:#fce4ec; color:#ad1457; border:1px solid #f48fb1; border-radius:12px;">
                    ✅ Inscription envoyée ! L'admin va valider ton compte.
                </div>

                <button id="btnInscription" class="btn btn-rose w-100 mt-2">S'inscrire</button>
            </div>

            <p class="text-center mt-3" style="font-size: 14px; color: #c2185b;">
                Déjà un compte ?
                <a href="login.html" class="lien-rose">Se connecter</a>
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('btnInscription').addEventListener('click', function () {
        const nom        = document.getElementById('nom').value.trim();
        const prenom     = document.getElementById('prenom').value.trim();
        const email      = document.getElementById('email').value.trim();
        const adresse    = document.getElementById('adresse').value.trim();
        const login      = document.getElementById('login').value.trim();
        const mdp        = document.getElementById('mdp').value;
        const mdpConfirm = document.getElementById('mdpConfirm').value;
        const sexe       = document.querySelector('input[name="sexe"]:checked');

        const erreur = document.getElementById('erreurInscription');
        const succes = document.getElementById('succesInscription');
        const btn    = document.getElementById('btnInscription');

        erreur.classList.add('d-none');
        succes.classList.add('d-none');

        if (!nom || !prenom || !email || !adresse || !login || !mdp || !mdpConfirm || !sexe) {
            erreur.textContent = 'Merci de remplir tous les champs.';
            erreur.classList.remove('d-none');
            return;
        }

        if (mdp !== mdpConfirm) {
            erreur.textContent = 'Les mots de passe ne correspondent pas.';
            erreur.classList.remove('d-none');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Envoi en cours...';

        fetch('backend/utilisateur/add_utilisateur.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nom, prenom, email, adresse, login, mdp })
        })
        .then(async r => {
            // On lit la réponse "brute" du serveur pour voir ce que PHP dit vraiment
            const texteBrut = await r.text();
            console.log("Réponse exacte du serveur PHP :", texteBrut);
            
            // On essaie de transformer le texte en JSON
            return JSON.parse(texteBrut);
        })
        .then(data => {
            if (data.status === 'success') {
                succes.classList.remove('d-none');
                document.querySelectorAll('input').forEach(i => i.value = '');
            } else {
                erreur.textContent = data.message || 'Une erreur est survenue.';
                erreur.classList.remove('d-none');
            }
        })
        .catch((err) => {
            // Si PHP n'a pas renvoyé de JSON, ça crashe ici, mais on a le log dans la console !
            erreur.textContent = "Ouvre la console (F12) ! Le serveur a renvoyé une erreur PHP visible dans les logs.";
            erreur.classList.remove('d-none');
            console.error("L'erreur Javascript :", err);
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = "S'inscrire";
        });
    });
</script>

</body>
</html>
