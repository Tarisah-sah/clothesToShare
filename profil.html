<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - ClothesToShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div id="composant-navbar"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white p-4">
                        <h2 class="mb-0 h4">Paramètres du compte</h2>
                    </div>
                    <div class="card-body p-4">
                        <form id="form-profil">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Prénom</label>
                                    <input type="text" class="form-control" id="profil-prenom" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Nom</label>
                                    <input type="text" class="form-control" id="profil-nom-input" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Login</label>
                                <input type="text" class="form-control" id="profil-login" required>
                            </div>

                            <hr class="my-4">
                            <h5 class="text-secondary mb-3">Changer le mot de passe</h5>
                            <p class="small text-muted">Laisse vide si tu ne souhaites pas le modifier.</p>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Nouveau mot de passe</label>
                                <input type="password" class="form-control" id="profil-mdp" placeholder="********">
                            </div>
                            
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Enregistrer les modifications</button>
                            </div>
                        </form>

                        <hr class="my-5">
                        <div class="card border-danger mb-5">
                            <div class="card-header bg-danger text-white fw-bold">
                                ⚠️ Zone de danger
                            </div>
                            <div class="card-body bg-danger bg-opacity-10 d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="card-title text-danger mb-1">Supprimer mon compte</h5>
                                    <p class="card-text text-muted small mb-0">Une fois ton compte supprimé, toutes tes données seront effacées. Cette action est irréversible.</p>
                                </div>
                                <button type="button" class="btn btn-danger fw-bold" id="btn-supprimer-compte">Supprimer définitivement</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/api.js"></script>
    <script src="frontend/js/ui.js"></script>
    <script src="frontend/js/auth.js"></script>
    <script src="frontend/js/profil.js"></script>
</body>
</html>
