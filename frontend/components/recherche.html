<div class="card shadow-sm mb-4 border-0 bg-light" id="section-recherche">
    <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center pt-3 pb-2" 
        data-bs-toggle="collapse" data-bs-target="#contenuRecherche" style="cursor: pointer;">
        <h5 class="card-title mb-0 text-secondary">Rechercher & Filtrer</h5>
        <button class="btn btn-sm btn-outline-secondary border-0">▼ Afficher / Masquer</button>
    </div>
    
    <div class="collapse" id="contenuRecherche">
        <div class="card-body pt-0">
            <form id="form-recherche" class="row g-3 align-items-end">
                <div class="col-12 col-md-4">
                    <label for="search-texte" class="form-label fw-bold small">Mot-clé (Général)</label>
                    <input type="text" class="form-control" id="search-texte" placeholder="Ex: Zara, L, Rouge...">
                </div>
                <div class="col-12 col-md-4">
                    <label for="search-categorie" class="form-label fw-bold small">Catégorie</label>
                    <select class="form-select" id="search-categorie">
                        <option value="">Chargement...</option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label for="search-etat" class="form-label fw-bold small">Statut</label>
                    <select class="form-select" id="search-etat">
                        <option value="">Tous</option>
                        <option value="Disponible">Disponible</option>
                        <option value="En prêt">En prêt</option>
                        <option value="Au lavage">Au lavage</option>
                    </select>
                </div>

                <div class="col-6 col-md-2">
                    <label for="search-taille" class="form-label fw-bold small">Taille</label>
                    <input type="text" class="form-control" id="search-taille" placeholder="Ex: M, 38">
                </div>
                <div class="col-6 col-md-2">
                    <label for="search-genre" class="form-label fw-bold small">Genre</label>
                    <select class="form-select" id="search-genre">
                        <option value="">Tous</option>
                        <option value="mixte">Mixte</option>
                        <option value="homme">Homme</option>
                        <option value="femme">Femme</option>
                    </select>
                </div>
                <div class="col-12 col-md-2">
                    <label for="search-type" class="form-label fw-bold small">Type</label>
                    <input type="text" class="form-control" id="search-type" placeholder="Ex: Haut">
                </div>
                <div class="col-12 col-md-2">
                    <label for="search-marque" class="form-label fw-bold small">Marque</label>
                    <input type="text" class="form-control" id="search-marque" placeholder="Ex: Nike">
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label fw-bold small mb-1">Couleurs</label>
                    <div class="d-flex flex-wrap gap-2 border rounded p-2 bg-white" style="max-height: 80px; overflow-y: auto;">
                        <div class="form-check form-check-inline me-2 mb-0">
                            <input class="form-check-input couleur-checkbox" type="checkbox" value="Noir" id="c-noir">
                            <label class="form-check-label small" for="c-noir">Noir</label>
                        </div>
                        <div class="form-check form-check-inline me-2 mb-0">
                            <input class="form-check-input couleur-checkbox" type="checkbox" value="Blanc" id="c-blanc">
                            <label class="form-check-label small" for="c-blanc">Blanc</label>
                        </div>
                        <div class="form-check form-check-inline me-2 mb-0">
                            <input class="form-check-input couleur-checkbox" type="checkbox" value="Rouge" id="c-rouge">
                            <label class="form-check-label small" for="c-rouge">Rouge</label>
                        </div>
                        <div class="form-check form-check-inline me-2 mb-0">
                            <input class="form-check-input couleur-checkbox" type="checkbox" value="Bleu" id="c-bleu">
                            <label class="form-check-label small" for="c-bleu">Bleu</label>
                        </div>
                        <div class="form-check form-check-inline me-2 mb-0">
                            <input class="form-check-input couleur-checkbox" type="checkbox" value="Rose" id="c-rose">
                            <label class="form-check-label small" for="c-rose">Rose</label>
                        </div>
                        <div class="form-check form-check-inline me-2 mb-0">
                            <input class="form-check-input couleur-checkbox" type="checkbox" value="Marron" id="c-marron">
                            <label class="form-check-label small" for="c-marron">Marron</label>
                        </div>
                        <div class="form-check form-check-inline me-2 mb-0">
                            <input class="form-check-input couleur-checkbox" type="checkbox" value="Vert" id="c-vert">
                            <label class="form-check-label small" for="c-vert">Vert</label>
                        </div>
                        <div class="form-check form-check-inline me-2 mb-0">
                            <input class="form-check-input couleur-checkbox" type="checkbox" value="Jaune" id="c-jaune">
                            <label class="form-check-label small" for="c-jaune">Jaune</label>
                        </div>
                    </div>
                </div>

                <div class="col-12 d-flex gap-2 justify-content-end mt-3">
                    <button type="submit" class="btn btn-primary">Filtrer</button>
                    <button type="button" class="btn btn-outline-secondary" id="btn-reset-recherche">✖ Réinitialiser</button>
                </div>
            </form>
        </div>
    </div>
</div>
