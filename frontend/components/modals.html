<div class="modal fade" id="modalModifier" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-secondary text-white">
                <h5 class="modal-title">Modifier le vêtement</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="form-modifier-vetement">
                    <input type="hidden" id="edit-idvetement-modal">
                    
                    <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label fw-bold">Nom du vêtement *</label>
                            <input type="text" class="form-control" id="edit-nom" required>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label fw-bold">Marque</label>
                            <input type="text" class="form-control" id="edit-marque">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-4 mb-3">
                            <label class="form-label fw-bold">Taille</label>
                            <input type="text" class="form-control" id="edit-taille" required>
                        </div>
                        <div class="col-4 mb-3">
                            <label class="form-label fw-bold">Couleur</label>
                            <input type="text" class="form-control" id="edit-couleur" required>
                        </div>
                        <div class="col-4 mb-3">
                            <label class="form-label fw-bold">Genre</label>
                            <select class="form-select" id="edit-genre">
                                <option value="mixte">Mixte</option>
                                <option value="homme">Homme</option>
                                <option value="femme">Femme</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Type * (ex: Haut, Pantalon)</label>
                            <input type="text" class="form-control" id="edit-type" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Catégorie *</label>
                            <select class="form-select" id="edit-idcategorie" required>
                                <option value="">Chargement...</option>
                            </select>
                        </div>
                    </div>

                    <input type="hidden" id="edit-etat">
                    <div class="row bg-light p-3 rounded mb-3 border mx-0">
                        <h6 class="fw-bold text-secondary mb-3">Emplacement du vêtement *</h6>
                        <div class="col-12 col-md-4 mb-2">
                            <label class="form-label small fw-bold">Local</label>
                            <select class="form-select" id="edit-idlocal" required>
                                <option value="">Choisir...</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4 mb-2">
                            <label class="form-label small fw-bold">Rangement</label>
                            <select class="form-select" id="edit-idrangement" required disabled>
                                <option value="">Choisir un local d'abord...</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-4 mb-2">
                            <label class="form-label small fw-bold">Niveau (Étagère)</label>
                            <select class="form-select" id="edit-idniveau" required disabled>
                                <option value="">Choisir un rangement d'abord...</option>
                            </select>
                        </div>
                    </div> 
                    <div class="col-12 mb-3">
                        <label class="form-label fw-bold">Photo du vêtement</label>
                        <input type="file" class="form-control" id="edit-photo" accept="image/*" capture="environment">
                        
                        <div class="form-text text-muted small">
                            Formats acceptés : JPG, PNG, WEBP. Taille max : 2 Mo.
                        </div>
                        
                        <div id="edit-preview" class="mt-2 d-none">
                            <img src="" class="img-thumbnail" style="height: 100px;">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Description</label>
                        <textarea class="form-control" id="edit-description" rows="3" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-secondary" id="btn-sauvegarder-modif">Mettre à jour</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalDetailsVetement" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h4 class="modal-title fw-bold" style="color: #ad1457;" id="detail-nom">Nom du vêtement</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <img src="" id="detail-photo" class="img-fluid rounded shadow-sm p-3 bg-light" style="width: 100%; object-fit: contain; height: 350px;">
                    </div>
                    
                    <div class="col-md-6">
                        <span class="badge bg-secondary mb-3 fs-6 shadow-sm" id="detail-etat">Etat</span>
                        
                        <div class="bg-light p-3 rounded mb-3 shadow-sm border">
                            <p class="mb-2"><i class="bi bi-tag-fill text-secondary me-2"></i><strong>Marque :</strong> <span id="detail-marque"></span></p>
                            <p class="mb-2"><i class="bi bi-arrows-fullscreen text-secondary me-2"></i><strong>Taille :</strong> <span id="detail-taille"></span></p>
                            <p class="mb-2"><i class="bi bi-palette-fill text-secondary me-2"></i><strong>Couleur :</strong> <span id="detail-couleur"></span></p>
                            <p class="mb-2"><i class="bi bi-gender-ambiguous text-secondary me-2"></i><strong>Genre :</strong> <span id="detail-genre" class="text-capitalize"></span></p>
                            <p class="mb-2"><i class="bi bi-info-circle-fill text-secondary me-2"></i><strong>Type :</strong> <span id="detail-type"></span></p>
                            <hr class="my-2 border-secondary">
                            <div class="d-flex align-items-center mt-2">
                                <i class="bi bi-person-badge-fill text-secondary me-2"></i><strong>Propriétaire :</strong> 
                                <span id="detail-proprio" class="ms-2 d-flex align-items-center gap-2"></span>
                            </div>
                        </div>

                        <h6 class="fw-bold text-secondary mt-4"><i class="bi bi-card-text me-2"></i>Description</h6>
                        <p id="detail-description" class="text-muted small"></p>
                    </div>
                </div>
                
                <div id="zone-emprunt" class="mt-3 p-3 bg-primary bg-opacity-10 rounded border border-primary shadow-sm d-none">
                    <h6 class="fw-bold text-primary mb-3"><i class="bi bi-bag-plus-fill me-2"></i>Tu veux l'emprunter ?</h6>
                    <div class="row align-items-end">
                        <div class="col-md-4 mb-2 mb-md-0">
                            <label class="form-label small fw-bold text-primary">Du (Début) *</label>
                            <input type="date" class="form-control border-primary" id="emprunt-date-debut">
                        </div>
                        <div class="col-md-4 mb-2 mb-md-0">
                            <label class="form-label small fw-bold text-primary">Au (Fin) *</label>
                            <input type="date" class="form-control border-primary" id="emprunt-date-fin">
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-primary w-100 fw-bold shadow-sm" id="btn-confirmer-emprunt">
                                <i class="bi bi-check2-circle me-1"></i> Confirmer
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPret" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Prêter un vêtement</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="pret-id-vetement">
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-primary">Vêtement</label>
                    <input type="text" class="form-control bg-light" id="pret-nom-vetement" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-primary">À qui souhaites-tu le prêter ? *</label>
                    <select class="form-select border-primary" id="pret-emprunteur" required>
                        <option value="">Sélectionner un utilisateur...</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold text-primary">Du (Début) *</label>
                        <input type="date" class="form-control border-primary" id="pret-date-debut" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold text-primary">Au (Fin) *</label>
                        <input type="date" class="form-control border-primary" id="pret-date-fin" required>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-primary fw-bold" id="btn-valider-pret">Valider le prêt</button>
            </div>
        </div>
    </div>
</div>
