<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClothesToShare - Garde-robe partagée</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">👕 ClothesToShare</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#" id="nav-accueil">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="nav-dressing">Mon Dressing</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="nav-login">Connexion</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4" id="app-content">

        <div class="card shadow-sm mb-4 border-0 bg-light" id="section-recherche">
            <div class="card-body">
                <h5 class="card-title mb-3 text-secondary">🔍 Trouver un vêtement</h5>
                <form id="form-recherche" class="row g-3 align-items-end">
                    <div class="col-12 col-md-4">
                        <label for="search-texte" class="form-label fw-bold small">Mot-clé</label>
                        <input type="text" class="form-control" id="search-texte" placeholder="Ex: Veste, Zara...">
                    </div>
                    <div class="col-12 col-md-3">
                        <label for="search-categorie" class="form-label fw-bold small">Catégorie</label>
                        <select class="form-select" id="search-categorie">
                            <option value="">Toutes</option>
                            <option value="1">Sportwear</option>
                            <option value="2">Accessories</option>
                            <option value="3">Nightwear</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-3">
                        <label for="search-etat" class="form-label fw-bold small">Statut</label>
                        <select class="form-select" id="search-etat">
                            <option value="">Tous</option>
                            <option value="Disponible">Disponible</option>
                            <option value="En prêt">En prêt</option>
                            <option value="Au lavage">Au lavage</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-2 d-grid d-md-flex gap-2 justify-content-md-end">
                        <button type="submit" class="btn btn-primary flex-grow-1">Filtrer</button>
                        <button type="button" class="btn btn-outline-secondary" id="btn-reset-recherche">✖</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="section-dressing">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Mon Dressing</h2>
                <button class="btn btn-primary" id="btn-afficher-ajout">+ Ajouter</button>
            </div>
            
            <div class="row g-4" id="liste-vetements">
            </div>
        </div>

        <div id="section-formulaire" style="display: none;">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h3 class="card-title h5 mb-0" id="form-titre">Ajouter un vêtement</h3>
                    <button type="button" class="btn-close btn-close-white" id="btn-fermer-form"></button>
                </div>
                <div class="card-body">
                    <form id="form-vetement">
                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-bold">Nom du vêtement *</label>
                                <input type="text" class="form-control" id="nom" required>
                            </div>
                            <div class="col-12 col-md-6 mb-3">
                                <label class="form-label fw-bold">Marque</label>
                                <input type="text" class="form-control" id="marque">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4 mb-3">
                                <label class="form-label fw-bold">Taille</label>
                                <input type="text" class="form-control" id="taille">
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label fw-bold">Couleur</label>
                                <input type="text" class="form-control" id="couleur">
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label fw-bold">Genre</label>
                                <select class="form-select" id="genre">
                                    <option value="mixte">Mixte</option>
                                    <option value="homme">Homme</option>
                                    <option value="femme">Femme</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">État *</label>
                            <select class="form-select" id="etat" required>
                                <option value="Disponible">Disponible</option>
                                <option value="En prêt">En prêt</option>
                                <option value="Au lavage">Au lavage</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Description</label>
                            <textarea class="form-control" id="description" rows="3"></textarea>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">Enregistrer</button>
                            <button type="button" class="btn btn-outline-danger" id="btn-annuler">Annuler</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <div class="modal fade" id="modalPret" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Enregistrer un prêt</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-pret">
                        <input type="hidden" id="pret-id-vetement">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Vêtement à prêter :</label>
                            <input type="text" class="form-control bg-light" id="pret-nom-vetement" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Prêté à qui ? *</label>
                            <select class="form-select" id="pret-emprunteur" required>
                                <option value="">Sélectionner un utilisateur...</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Date de début *</label>
                                <input type="date" class="form-control" id="pret-date-debut" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Date de fin prévue *</label>
                                <input type="date" class="form-control" id="pret-date-fin" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Commentaire</label>
                            <textarea class="form-control" id="pret-commentaire" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" id="btn-valider-pret">Valider</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/auth.js"></script>
    <script src="frontend/js/main.js"></script>
</body>
</html>
